<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>5秒ごとに変貌する猫のサイト</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            min-height: 100vh;
            background-color: #111;
            overflow: hidden;
            position: relative;
            cursor: none; /* 標準カーソルを非表示 */
        }

        /* 背景：現実の猫の画像グリッド */
        .cat-grid {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            grid-template-rows: repeat(auto-fill, minmax(120px, 1fr));
            gap: 2px;
            background-color: #000;
        }

        .cat-cell {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.8;
            /* 画像切り替え時のチカチカを抑え、滑らかにフェードインさせる効果 */
            transition: opacity 0.5s ease-in-out;
        }
        .cat-cell:hover {
            opacity: 1.0;
        }

        /* カーソルを追従する現実の猫の画像 */
        #cat-follower {
            position: fixed;
            top: 0;
            left: 0;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 3px solid #fff;
            box-shadow: 0 0 15px rgba(0,0,0,0.5);
            object-fit: cover;
            pointer-events: none;
            z-index: 9999;
            transform: translate3d(0, 0, 0);
            will-change: transform;
            /* カーソルの猫自体が切り替わる際のスムーズな移行 */
            transition: src 0.3s ease;
        }
    </style>
</head>
<body>

    <div class="cat-grid" id="grid"></div>
    <img id="cat-follower" src="https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba?w=150&auto=format&fit=crop&q=80" alt="follower">

    <script>
        const grid = document.getElementById('grid');
        const follower = document.getElementById('cat-follower');

        // 現実の猫写真URLのプール（厳選された異なる6種）
        const catImages = [
            "https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba?w=150&auto=format&fit=crop&q=60",
            "https://images.unsplash.com/photo-1495360010541-f48722b34f7d?w=150&auto=format&fit=crop&q=60",
            "https://images.unsplash.com/photo-1533738363-b7f9aef128ce?w=150&auto=format&fit=crop&q=60",
            "https://images.unsplash.com/photo-1573865526739-10659fec78a5?w=150&auto=format&fit=crop&q=60",
            "https://images.unsplash.com/photo-1543466835-00a7907e9de1?w=150&auto=format&fit=crop&q=60",
            "https://images.unsplash.com/photo-1519052537078-e6302a4968d4?w=150&auto=format&fit=crop&q=60"
        ];

        // 1. グリッドの生成（初期化）
        const cellWidth = 120;
        const cellHeight = 120;
        const cols = Math.ceil(window.innerWidth / cellWidth);
        const rows = Math.ceil(window.innerHeight / cellHeight);
        const totalCells = cols * rows * 1.2;

        for (let i = 0; i < totalCells; i++) {
            const img = document.createElement('img');
            img.className = 'cat-cell';
            grid.appendChild(img);
        }

        const allCells = document.querySelectorAll('.cat-cell');

        // 2. すべての画像を一括でランダム更新する関数
        function updateAllImages() {
            // キャッシュによる「切り替わらないバグ」を防ぐため、タイムスタンプを付与
            const timestamp = Date.now();
            
            // 背景グリッドの猫をすべて変更
            allCells.forEach((img, index) => {
                const randomImg = catImages[Math.floor(Math.random() * catImages.length)];
                img.src = randomImg + `&timestamp=${timestamp}&id=${index}`;
            });

            // カーソルの猫も同時に変更
            const randomFollower = catImages[Math.floor(Math.random() * catImages.length)];
            follower.src = randomFollower + `&timestamp=${timestamp}&type=follower`;
        }

        // 初回実行
        updateAllImages();

        // 3. 厳密に5000ミリ秒（5秒）ごとに画像を変えるタイマー
        setInterval(updateAllImages, 5000);

        // 4. マウス追従ロジック（現行維持）
        let mouseX = 0;
        let mouseY = 0;
        let currentX = 0;
        let currentY = 0;

        window.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
        });

        function animate() {
            currentX += (mouseX - currentX) * 0.1;
            currentY += (mouseY - currentY) * 0.1;

            const targetX = currentX - 40;
            const targetY = currentY - 40;

            follower.style.transform = `translate3d(${targetX}px, ${targetY}px, 0)`;
            requestAnimationFrame(animate);
        }
        animate();

        document.addEventListener('mouseleave', () => follower.style.display = 'none');
        document.addEventListener('mouseenter', () => follower.style.display = 'block');
    </script>
</body>
</html>
